<p>從 Apple 台灣官網擷取規格與起售價，以本機 LLM 整理並保留原文依據。</p>
<div class="actions"><button id="start" class="button">開始爬取</button><button id="cancel" class="button secondary" disabled>取消工作</button><a href="/settings">爬蟲設定</a></div>
